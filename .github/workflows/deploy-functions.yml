name: Deploy Cloud Functions

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - kanameone
          - cocoro
      gemini_model_id_override:
        description: 'GEMINI_MODEL_ID override (未指定=code-default(現在gemini-3.5-flash)。Issue #548の3.5移行検証が完了するまでkanameone等はgemini-2.5-flash固定を推奨)'
        required: true
        default: 'code-default'
        type: choice
        options:
          - code-default
          - gemini-2.5-flash
          - gemini-3.5-flash
      ocr_provider_override:
        description: 'OCR_PROVIDER override (ADR-0025。未指定=code-default=scripts/clients/<環境>.envのOCR_PROVIDER宣言値を維持、宣言なしならコード既定gemini。paddleを選ぶ前に対象環境のPADDLE_OCR_URLが設定済みであること)'
        required: true
        default: 'code-default'
        type: choice
        options:
          - code-default
          - gemini
          - paddle
      summary_provider_override:
        description: 'SUMMARY_PROVIDER override (ADR-0027。未指定=code-default=scripts/clients/<環境>.envのSUMMARY_PROVIDER宣言値を維持、宣言なしならコード既定none。sarashinaを選ぶ前に対象環境のSARASHINA_SUMMARY_URLが設定済み、かつdeploy-sarashina-summary.ymlのrun.invoker付与が反映済みであること)'
        required: true
        default: 'code-default'
        type: choice
        options:
          - code-default
          - none
          - gemini
          - sarashina

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
        continue-on-error: true

      - name: Install dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build functions
        working-directory: ./functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: |-
            ${{ github.event.inputs.environment == 'kanameone' && secrets.GCP_SA_KEY_KANAMEONE ||
                github.event.inputs.environment == 'dev' && secrets.GCP_SA_KEY_DEV ||
                secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Functions
        run: |
          # 環境に応じてプロジェクトを切り替え (.firebaserc参照)
          if [ "${{ github.event.inputs.environment }}" == "cocoro" ]; then
            PROJECT_ALIAS="cocoro"
            PROJECT_ID="docsplit-cocoro"
          elif [ "${{ github.event.inputs.environment }}" == "kanameone" ]; then
            PROJECT_ALIAS="kanameone"
            PROJECT_ID="docsplit-kanameone"
          else
            PROJECT_ALIAS="dev"
            PROJECT_ID="doc-split-dev"
          fi

          # STORAGE_BUCKET (必須): functions/src/index.ts の admin.initializeApp() が
          # process.env.STORAGE_BUCKET に依存しているが、functions/.env.<project-id> は
          # これまで一度も生成されておらず、kanameone実機で undefined のまま運用されていた
          # (2026-07-08 canary検証で発覚: storage.bucket()を引数無しで呼ぶ再OCR時の
          # 再ダウンロード経路(ocrProcessor.ts, Issue #526 pageResults再利用フォールバック)
          # で "Bucket name not specified or invalid" エラーが発生することを実機確認)。
          # scripts/clients/<alias>.env の値が正解(CLAUDE.md: プロジェクトIDからの推測禁止、
          # .appspot.com/.firebasestorage.app の形式は環境ごとに異なる)。
          ENV_FILE="scripts/clients/${PROJECT_ALIAS}.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: $ENV_FILE が見つかりません" >&2
            exit 1
          fi
          STORAGE_BUCKET=$(grep -E '^STORAGE_BUCKET=' "$ENV_FILE" | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
          if [ -z "$STORAGE_BUCKET" ]; then
            echo "ERROR: $ENV_FILE に STORAGE_BUCKET が見つかりません" >&2
            exit 1
          fi
          echo "STORAGE_BUCKET=${STORAGE_BUCKET}" > "functions/.env.${PROJECT_ID}"
          echo "STORAGE_BUCKET 設定: ${STORAGE_BUCKET} (functions/.env.${PROJECT_ID})"

          # GEMINI_MODEL_ID override (任意): Firebase Functions v2は環境変数を
          # functions/.env.<project-id> ファイルから読む(シェル環境変数は伝播しない)。
          # 未指定(code-default)ならfunctions/src/utils/config.tsのコード既定値を使用。
          if [ "${{ github.event.inputs.gemini_model_id_override }}" != "code-default" ]; then
            echo "GEMINI_MODEL_ID=${{ github.event.inputs.gemini_model_id_override }}" >> "functions/.env.${PROJECT_ID}"
            echo "GEMINI_MODEL_ID override 適用: ${{ github.event.inputs.gemini_model_id_override }} (functions/.env.${PROJECT_ID})"
          fi

          # PADDLE_OCR_URL (任意、ADR-0025): deploy-paddle-ocr.ymlのresolve_field_optional()と
          # 同型。dev以外はPaddleOCR未デプロイのためscripts/clients/<alias>.envが<TBD>のままの
          # ケースを許容し、その場合は書き込みをスキップする(codex review P1指摘対応: このURLを
          # 書かないとOCR_PROVIDER=paddleを選んでもPaddleOCRへ到達できず、機能が永久に無効化される)。
          resolve_field_optional() {
            local field="$1"
            local file="$2"
            local val
            val=$(grep -E "^${field}=" "$file" | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
            val="${val#"${val%%[![:space:]]*}"}"
            val="${val%"${val##*[![:space:]]}"}"
            case "$val" in
              ""|"<TBD>"|"TBD"|"tbd"|"<TODO>"|"TODO"|"todo"|"<FIXME>"|"FIXME"|"fixme"|"null"|"NULL"|"undefined"|"UNDEFINED"|"xxx"|"XXX"|"<PLACEHOLDER>")
                echo ""
                ;;
              *)
                echo "$val"
                ;;
            esac
          }
          PADDLE_OCR_URL=$(resolve_field_optional PADDLE_OCR_URL "$ENV_FILE")
          if [ -n "$PADDLE_OCR_URL" ]; then
            echo "PADDLE_OCR_URL=${PADDLE_OCR_URL}" >> "functions/.env.${PROJECT_ID}"
            echo "PADDLE_OCR_URL 設定: ${PADDLE_OCR_URL} (functions/.env.${PROJECT_ID})"
          fi

          # OCR_PROVIDER (ADR-0025 L1ゲート)。解決順: 明示override > scripts/clients/<alias>.env
          # の宣言値 > コード既定。code-default選択時にfunctions/.env.<project>が毎回再生成されて
          # 既存のL1設定が無言で外れる事故(2026-09-23/25にkanameone・cocoroでpaddle→gemini回帰)の
          # 再発防止として、code-defaultは「宣言値を維持」の意味にしている。一時的なロールバックは
          # 明示override(gemini)、恒久的な変更は<alias>.envの宣言を書き換える。
          # paddleが有効なのに対象環境のPADDLE_OCR_URLが未設定(<TBD>)の場合は、デプロイ後に
          # fail-loudするpaddleOcrClient.tsの挙動を待たずここで即座に検知する。
          OCR_PROVIDER_EFFECTIVE="${{ github.event.inputs.ocr_provider_override }}"
          if [ "$OCR_PROVIDER_EFFECTIVE" == "code-default" ]; then
            OCR_PROVIDER_EFFECTIVE=$(resolve_field_optional OCR_PROVIDER "$ENV_FILE")
          fi
          if [ -n "$OCR_PROVIDER_EFFECTIVE" ]; then
            case "$OCR_PROVIDER_EFFECTIVE" in
              gemini|paddle) ;;
              *)
                echo "ERROR: OCR_PROVIDER=$OCR_PROVIDER_EFFECTIVE は不正です(gemini|paddleのみ。$ENV_FILE の宣言を確認してください)" >&2
                exit 1
                ;;
            esac
            if [ "$OCR_PROVIDER_EFFECTIVE" == "paddle" ] && [ -z "$PADDLE_OCR_URL" ]; then
              echo "ERROR: OCR_PROVIDER=paddle ですが、$ENV_FILE のPADDLE_OCR_URLが未設定です" >&2
              exit 1
            fi
            echo "OCR_PROVIDER=${OCR_PROVIDER_EFFECTIVE}" >> "functions/.env.${PROJECT_ID}"
            echo "OCR_PROVIDER 適用: ${OCR_PROVIDER_EFFECTIVE} (override=${{ github.event.inputs.ocr_provider_override }}, functions/.env.${PROJECT_ID})"
          else
            echo "OCR_PROVIDER 未設定: コード既定(gemini)で動作します(override=code-default、$ENV_FILE に宣言なし)"
          fi

          # SARASHINA_SUMMARY_URL (任意、ADR-0027): PADDLE_OCR_URLと同型。dev以外はまだ
          # デプロイ済みでないケースを許容し、その場合は書き込みをスキップする(このURLを
          # 書かないとSUMMARY_PROVIDER=sarashinaを選んでもSarashinaへ到達できず機能が
          # 永久に無効化される)。
          SARASHINA_SUMMARY_URL=$(resolve_field_optional SARASHINA_SUMMARY_URL "$ENV_FILE")
          if [ -n "$SARASHINA_SUMMARY_URL" ]; then
            echo "SARASHINA_SUMMARY_URL=${SARASHINA_SUMMARY_URL}" >> "functions/.env.${PROJECT_ID}"
            echo "SARASHINA_SUMMARY_URL 設定: ${SARASHINA_SUMMARY_URL} (functions/.env.${PROJECT_ID})"
          fi

          # SUMMARY_PROVIDER (ADR-0027 L1ゲート): OCR_PROVIDERと同じ解決順
          # (明示override > <alias>.envの宣言値 > コード既定none)と同じ再発防止。
          # sarashinaが有効なのに対象環境のSARASHINA_SUMMARY_URLが未設定(<TBD>)の場合は、
          # デプロイ後にfail-loudする挙動を待たずここで即座に検知する。
          SUMMARY_PROVIDER_EFFECTIVE="${{ github.event.inputs.summary_provider_override }}"
          if [ "$SUMMARY_PROVIDER_EFFECTIVE" == "code-default" ]; then
            SUMMARY_PROVIDER_EFFECTIVE=$(resolve_field_optional SUMMARY_PROVIDER "$ENV_FILE")
          fi
          if [ -n "$SUMMARY_PROVIDER_EFFECTIVE" ]; then
            case "$SUMMARY_PROVIDER_EFFECTIVE" in
              none|gemini|sarashina) ;;
              *)
                echo "ERROR: SUMMARY_PROVIDER=$SUMMARY_PROVIDER_EFFECTIVE は不正です(none|gemini|sarashinaのみ。$ENV_FILE の宣言を確認してください)" >&2
                exit 1
                ;;
            esac
            if [ "$SUMMARY_PROVIDER_EFFECTIVE" == "sarashina" ] && [ -z "$SARASHINA_SUMMARY_URL" ]; then
              echo "ERROR: SUMMARY_PROVIDER=sarashina ですが、$ENV_FILE のSARASHINA_SUMMARY_URLが未設定です" >&2
              exit 1
            fi
            echo "SUMMARY_PROVIDER=${SUMMARY_PROVIDER_EFFECTIVE}" >> "functions/.env.${PROJECT_ID}"
            echo "SUMMARY_PROVIDER 適用: ${SUMMARY_PROVIDER_EFFECTIVE} (override=${{ github.event.inputs.summary_provider_override }}, functions/.env.${PROJECT_ID})"
          else
            echo "SUMMARY_PROVIDER 未設定: コード既定(none)で動作します(override=code-default、$ENV_FILE に宣言なし)"
          fi

          echo "Deploying to: $PROJECT_ALIAS"
          firebase deploy --only functions -P $PROJECT_ALIAS --force

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == 'success' ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
          fi
