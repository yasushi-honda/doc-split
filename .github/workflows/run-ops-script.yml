          - resolve-drive-duplicate-file
          - resolve-drive-duplicate-file --execute
          - backfill-drive-folder-claim-ttl
          - backfill-drive-folder-claim-ttl --execute
          - classify-drive-claim-divergence
          - execute-drive-claim-resync --dry-run
          - execute-drive-claim-resync --execute
          - execute-drive-claim-resync --execute --requeue
          - set-feature-flag --flag sarashinaSummary --value true --dry-run
          - set-feature-flag --flag sarashinaSummary --value true
          - set-feature-flag --flag sarashinaSummary --value false --dry-run
          - set-feature-flag --flag sarashinaSummary --value false
          - set-sarashina-summary-allowlist --set --dry-run
          - set-sarashina-summary-allowlist --set
          - set-sarashina-summary-allowlist --clear-empty --dry-run
          - set-sarashina-summary-allowlist --clear-empty
          - set-sarashina-summary-allowlist --remove --dry-run
          - set-sarashina-summary-allowlist --remove
          - check-sarashina-summary-status
          - check-sarashina-summary-canary --canary-ids
          - check-sarashina-summary-canary --hours 24
          - check-sarashina-summary-canary --hours 168
          - requeue-summary-to-pending --requeue-ids
          - requeue-summary-to-pending --requeue-ids --execute
          - clear-unmarked-pending-summary
          - clear-unmarked-pending-summary --execute
      backfill_limit:
        description: 'backfill-drive-export --limit: canary実行時のマーク上限件数(数値のみ) / classify-drive-export-drift --limit: 検査対象document数の上限(数値のみ) / execute-drive-export-repair --limit: 修復対象候補数の上限(数値のみ) / backfill-confirm-on-verify --limit: canary実行時の確定対象上限件数(数値のみ) / backfill-customer-id-link --limit: canary実行時の紐づけ対象上限件数(数値のみ)'
        required: false
        type: string
        default: ''
      doc_id:
        description: 'Document ID (required when script contains --doc-id, set-drive-allowlist --set, or set-paddle-ocr-allowlist --set; for set-paddle-ocr-allowlist --set or set-sarashina-summary-allowlist --set, comma-separated IDs allowed (max 10); required for check-sarashina-summary-canary --canary-ids and requeue-summary-to-pending --requeue-ids (1-10 comma-separated IDs); ignored otherwise)'
        required: false
        type: string
        default: ''
      file_name:
        description: 'fileName (required when script contains "inspect-document --file-name"; ignored otherwise)'
        required: false
        type: string
        default: ''
      name1:
        description: 'Name 1 (required for investigate-office-duplicate / investigate-caremanager-duplicate / investigate-caremanager-folder-duplicate; investigate-drive-folder-duplicate-by-name の --name-contains 検索語; classify-drive-export-drift --care-manager 指定時のケアマネ名; ignored otherwise)'
        required: false
        type: string
        default: ''
      name2:
        description: 'Name 2 (optional, for paired comparison; e.g. duplicate candidate variant like the trailing-zero suffix case)'
        required: false
        type: string
        default: ''
      from_name:
        description: 'cleanup-office-name: 書き換え元の事業所名（例: ケア21上飯田0）'
        required: false
        type: string
        default: ''
      to_name:
        description: 'cleanup-office-name: 書き換え先の事業所名（例: ケア21上飯田）'
        required: false
        type: string
        default: ''
      delete_from_master:
        description: 'cleanup-office-name: 旧マスターを削除するか（true で削除）'
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
      expected_count:
        description: 'cleanup-office-name / delete-office-master / reset-documents-by-office: 影響件数の事前確認（数値；省略時はチェック無効、指定時は不一致で中断）/ execute-drive-export-repair --expected-count: --limit適用後の修復対象件数の事前確認(数値) / backfill-confirm-on-verify --expected-count: 対象件数の事前確認(数値、誤操作防止) / backfill-customer-id-link --expected-count: 紐づけ対象件数の事前確認(数値、dry-runの件数と一致必須)'
        required: false
        type: string
        default: ''
      delete_ids:
        description: 'delete-office-master: 削除対象 master id (CSV、例: 6umj52B2r7pYLYWJjPx8,ケア,ニック)'
        required: false
        type: string
        default: ''
      office_names:
        description: 'reset-documents-by-office: 対象 officeName (CSV、例: ケア,ニック)'
        required: false
        type: string
        default: ''
      office_ids:
        description: 'reset-documents-by-office: 対象 officeId (CSV、例: 6umj52B2r7pYLYWJjPx8,ケア,ニック)'
        required: false
        type: string
        default: ''
      exec_args_json:
        description: 'execute-collision-migration: JSON {"planRunId":"<classify run id>","approvedOperationIds":["op-0001",...]} / investigate-issue811-root-cause: JSON {"folderIds":[...],"docIds":[...]} / classify-drive-folder-duplicates: JSON {"canonicalFolderId":"...","duplicateFolderIds":["id1","id2"]} / execute-drive-folder-merge: JSON {"planRunId":"<classify-drive-folder-duplicates run id>","approvedOperationIds":["op-0001",...]} / rollback-drive-folder-merge: JSON {"manifestRunId":"<execute-drive-folder-merge run id>","approvedOperationIds":["op-0001",...]}(approvedOperationIds省略時はmanifest全件を対象) / execute-drive-export-repair: JSON {"planRunId":"<classify-drive-export-drift run id>","expectedTotal":488,"acknowledgeRestoreFolders":false}(planRunId必須、expectedTotal/acknowledgeRestoreFoldersは省略可) / diagnose-drive-folder-duplicate-causality: JSON {"folderIds":["id1","id2",...]} / inspect-drive-items: JSON {"ids":["<Drive項目ID>",...]}(read-only、種別・親の連鎖・ショートカット参照先をIDのみで出力) / compare-drive-folder-pairs: JSON {"pairs":[["idA","idB"],...]}(A=app作成側/B=人作成側、フォルダIDのみ。read-only、出力は件数のみでファイル名は含まない) / execute-drive-claim-resync: JSON {"planRunId":"<classify-drive-claim-divergence run id>","approvedOperations":{"op-0001":{"mode":"restore-expected"},"op-0002":{"mode":"release-claim","acknowledgedStrandedFiles":0}}}(modeはrestore-expected/release-claim/finalize-resolvedのいずれか、release-claimでdirectChildCount>0の場合のみacknowledgedStrandedFilesが必須) / plan-drive-folder-tree-merge: JSON {"sourceFolderId":"<統合元(消える側)>","targetFolderId":"<統合先(残す側)>"}(read-only、出力は件数とIDのみ) / execute-drive-folder-tree-merge: JSON {"planRunId":"<plan-drive-folder-tree-merge run id>","expectedFileMoves":N,"expectedFolderMoves":N,"expectedFolderTrashes":N}(件数はplan出力と一致必須) / execute-drive-sibling-merge: JSON {"planRunId":"<audit-drive-sibling-duplicates run id>","approvedGroupIds":["parentId:name",...]}(groupIdはaudit-drive-sibling-duplicatesが出力するplan-output.jsonのgroups[].groupIdをそのまま指定)'
        required: false
        type: string
        default: ''
      survey_artifact_run_id:
        description: 'classify-collision-docs: 前段 pdf-feature-survey workflow run ID (PR-C3c AC15-1 必須、数値のみ)'
        required: false
        type: string
        default: ''
      marked_by:
        description: 'delete-legacy-ocr-fields --mark-preflight: 記録者名 (監査証跡、必須)'
        required: false
        type: string
        default: ''
      run_id_for_rollback:
        description: 'delete-legacy-ocr-fields --rollback: 対象のrun-id (--execute実行結果ログに表示される値)'
        required: false
        type: string
        default: ''
      rebuild_group_ids:
        description: 'migrate-document-groups --rebuild-groups: 対象groupId (改行区切り、1行1件。例: careManager_奥村敬子\ncareManager___UNASSIGNED_CARE_MANAGER__。scripts/diagnose-caremanager-group-gap.jsの出力形式そのまま指定。カンマ区切りではない理由: groupKeyは自由入力の名前由来でカンマを含みうるため(codex review P2指摘)'
        required: false
        type: string
        default: ''

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (firebase-admin)
        working-directory: ./functions
        run: npm ci

      - name: Build functions (for scripts that require compiled lib/ — e.g. force-reindex)
        working-directory: ./functions
        run: npm run build

      - name: Install scripts devDependencies (ts-node for .ts scripts)
        working-directory: ./scripts
        run: npm install --no-audit --no-fund

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: |-
            ${{ github.event.inputs.environment == 'kanameone' && secrets.GCP_SA_KEY_KANAMEONE ||
                github.event.inputs.environment == 'dev' && secrets.GCP_SA_KEY_DEV ||
                secrets.GCP_SA_KEY }}

      - name: Resolve project ID and storage bucket
        id: resolve
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          PROJECT_ID=$(node scripts/helpers/firebaserc-helper.js get-project "$ENVIRONMENT")
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved project_id: $ENVIRONMENT → $PROJECT_ID"

          # CLAUDE.md「Storage バケット名」: .appspot.com / .firebasestorage.app 混在で
          # projectId からの推測禁止。scripts/clients/<env>.env の STORAGE_BUCKET を抽出する。
          # ENVIRONMENT は workflow_dispatch.choice で固定 enum (dev / kanameone / cocoro)、
          # path traversal リスクなし。
          ENV_FILE="scripts/clients/${ENVIRONMENT}.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: $ENV_FILE not found" >&2
            exit 1
          fi
          STORAGE_BUCKET=$(grep -E '^STORAGE_BUCKET=' "$ENV_FILE" | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
          if [ -z "$STORAGE_BUCKET" ]; then
            echo "ERROR: STORAGE_BUCKET not found in $ENV_FILE" >&2
            exit 1
          fi
          echo "storage_bucket=$STORAGE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "Resolved storage_bucket: $STORAGE_BUCKET"

      - name: Parse script and args
        id: parse
        env:
          INPUT: ${{ github.event.inputs.script }}
          DOC_ID: ${{ github.event.inputs.doc_id }}
          EXPECTED_COUNT: ${{ github.event.inputs.expected_count }}
          BACKFILL_LIMIT: ${{ github.event.inputs.backfill_limit }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          SCRIPT_NAME=$(echo "$INPUT" | awk '{print $1}')
          SCRIPT_ARGS=$(echo "$INPUT" | sed 's/^[^ ]* *//')
          if [ "$SCRIPT_ARGS" = "$SCRIPT_NAME" ]; then
            SCRIPT_ARGS=""
          fi

          # codex review(strict-config+high effort)P1指摘反映: ADR-0027のPR5はdev限定の
          # 有効化であり、kanameone/cocoroへの展開は別途承認が必要なPR6のスコープ
          # (docs/adr/0027-sarashina-summary-migration.md L72)。set-feature-flag
          # --flag sarashinaSummaryとset-sarashina-summary-allowlistの書込み系操作を
          # dev以外の環境で誤実行すると、PR6の承認を経ずに本番でL2フラグが有効化されうる。
          # observation job(check-sarashina-summary-status、read-only)は対象外。
          # PR-D(通常経路のGemini停止計画、PR6)でdecision-makerがkanameoneのcanaryを承認したため、
          # dev+kanameoneまで許可する。cocoroはkanameoneのcanary合格後に別途承認(このガードで引き続き拒否)。
          # requeue-summary-to-pending(要約をpendingへ戻す書込み系)も同じ対象に含める。
          if { [ "$SCRIPT_NAME" = "set-feature-flag" ] && echo "$SCRIPT_ARGS" | grep -q -- '--flag sarashinaSummary'; } || \
             [ "$SCRIPT_NAME" = "set-sarashina-summary-allowlist" ] || \
             [ "$SCRIPT_NAME" = "requeue-summary-to-pending" ]; then
            if [ "$ENVIRONMENT" != "dev" ] && [ "$ENVIRONMENT" != "kanameone" ]; then
              echo "ERROR: sarashinaSummaryのflag/allowlist/requeue操作はdev・kanameone限定です(cocoroはkanameoneのcanary合格後に別途承認)。environment=dev または kanameone を指定してください(現在: $ENVIRONMENT)" >&2
              exit 1
            fi
          fi

          # --doc-id 指定スクリプトには doc_id 入力を必須化
          if echo "$SCRIPT_ARGS" | grep -q -- '--doc-id'; then
            if [ -z "$DOC_ID" ]; then
              echo "ERROR: doc_id input is required when script contains --doc-id" >&2
              exit 1
            fi
            # ドキュメントIDは英数字のみ許可（コマンドインジェクション対策）
            if ! echo "$DOC_ID" | grep -qE '^[A-Za-z0-9_-]+$'; then
              echo "ERROR: doc_id must contain only alphanumeric, underscore, hyphen characters" >&2
              exit 1
            fi
            SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--doc-id/--doc-id $DOC_ID/")
          fi

          # set-drive-allowlist --set は単一docIdをdoc_id入力から受け取る(Phase D Stage D
          # コントロールテスト用、複数指定はスコープ外)。既存の--doc-id置換と同一パターン。
          if [ "$SCRIPT_NAME" = "set-drive-allowlist" ] && echo "$SCRIPT_ARGS" | grep -q -- '--set'; then
            if [ -z "$DOC_ID" ]; then
              echo "ERROR: doc_id input is required when script contains set-drive-allowlist --set" >&2
              exit 1
            fi
            if ! echo "$DOC_ID" | grep -qE '^[A-Za-z0-9_-]+$'; then
              echo "ERROR: doc_id must contain only alphanumeric, underscore, hyphen characters" >&2
              exit 1
            fi
            SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--set/--set $DOC_ID/")
          fi

          # set-paddle-ocr-allowlist --set(ADR-0025 Pass1 canary展開用)は
          # set-drive-allowlist --setと同一パターン(単一docIdをdoc_id入力から受け取る)想定
          # だったが、set-paddle-ocr-allowlist.js自体はscripts/set-sarashina-summary-allowlist.js
          # と同じ`.split(',')`実装でカンマ区切り複数IDに元々対応している。ADR-0027 PR5 S7a
          # (canary複数件を一度にPaddle allowlistへ設定する必要があるケース)で発覚したため、
          # set-sarashina-summary-allowlistと同じカンマ区切り最大10件許可へ緩和する
          # (既存の単一ID運用は`^id$`が`^id(,id){0,9}$`の部分集合のため無影響)。
          if [ "$SCRIPT_NAME" = "set-paddle-ocr-allowlist" ] && echo "$SCRIPT_ARGS" | grep -q -- '--set'; then
            if [ -z "$DOC_ID" ]; then
              echo "ERROR: doc_id input is required when script contains set-paddle-ocr-allowlist --set" >&2
              exit 1
            fi
            if ! echo "$DOC_ID" | grep -qE '^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+){0,9}$'; then
              echo "ERROR: doc_id must be 1-10 comma-separated alphanumeric/underscore/hyphen IDs" >&2
              exit 1
            fi
            SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--set/--set $DOC_ID/")
          fi

          # set-sarashina-summary-allowlist --set(ADR-0027 PR5 canary展開用)は、
          # set-paddle-ocr-allowlist --setと異なりcanary複数件を一度に指定できるよう
          # カンマ区切り最大10件を許可する(新規分岐、既存の単一ID運用には影響しない)。
          if [ "$SCRIPT_NAME" = "set-sarashina-summary-allowlist" ] && echo "$SCRIPT_ARGS" | grep -q -- '--set'; then
            if [ -z "$DOC_ID" ]; then
              echo "ERROR: doc_id input is required when script contains set-sarashina-summary-allowlist --set" >&2
              exit 1
            fi
            if ! echo "$DOC_ID" | grep -qE '^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+){0,9}$'; then
              echo "ERROR: doc_id must be 1-10 comma-separated alphanumeric/underscore/hyphen IDs" >&2
              exit 1
            fi
            SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--set/--set $DOC_ID/")
          fi

          # check-sarashina-summary-canary --canary-ids (ADR-0027 PR6 canary測定、read-only)は
          # canary文書をカンマ区切り最大10件でdoc_id入力から受け取る。引数名を--doc-idにしないのは、
          # 上の汎用--doc-id分岐(単一ID専用の正規表現)に部分一致して誤動作するのを避けるため。
          if [ "$SCRIPT_NAME" = "check-sarashina-summary-canary" ] && echo "$SCRIPT_ARGS" | grep -q -- '--canary-ids'; then
            if [ -z "$DOC_ID" ]; then
              echo "ERROR: doc_id input is required when script contains check-sarashina-summary-canary --canary-ids" >&2
              exit 1
            fi
            if ! echo "$DOC_ID" | grep -qE '^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+){0,9}$'; then
              echo "ERROR: doc_id must be 1-10 comma-separated alphanumeric/underscore/hyphen IDs" >&2
              exit 1
            fi
            SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--canary-ids/--canary-ids $DOC_ID/")
          fi

          # requeue-summary-to-pending --requeue-ids (PR-D canary再投入、書込み系)も同型。
          # 既定はdry-run、--executeを含む選択肢のときだけ実書込みする。
          if [ "$SCRIPT_NAME" = "requeue-summary-to-pending" ] && echo "$SCRIPT_ARGS" | grep -q -- '--requeue-ids'; then
            if [ -z "$DOC_ID" ]; then
              echo "ERROR: doc_id input is required when script contains requeue-summary-to-pending --requeue-ids" >&2
              exit 1
            fi
            # 先頭は英数字(--execute等のオプションがIDとして通るのを防ぐ。scripts/lib/summaryRequeue.tsと同一規則)
            if ! echo "$DOC_ID" | grep -qE '^[A-Za-z0-9][A-Za-z0-9_-]*(,[A-Za-z0-9][A-Za-z0-9_-]*){0,9}$'; then
              echo "ERROR: doc_id must be 1-10 comma-separated IDs (start with alphanumeric; alphanumeric/underscore/hyphen only)" >&2
              exit 1
            fi
            SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--requeue-ids/--requeue-ids $DOC_ID/")
          fi

          # backfill-drive-export --limit/--expected-count はStage E1 canary安全策
          # (breezy-tickling-sifakis.md runbook)。値省略は誤操作(無制限全件処理)に
          # つながるため、既存の--doc-id置換と同一パターンでinputからの明示値を必須化する。
          if [ "$SCRIPT_NAME" = "backfill-drive-export" ]; then
            if echo "$SCRIPT_ARGS" | grep -q -- '--limit'; then
              if [ -z "$BACKFILL_LIMIT" ] || ! echo "$BACKFILL_LIMIT" | grep -qE '^[0-9]+$'; then
                echo "ERROR: backfill_limit must be a non-negative integer when script contains --limit" >&2
                exit 1
              fi
              SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--limit/--limit $BACKFILL_LIMIT/")
            fi
            if echo "$SCRIPT_ARGS" | grep -q -- '--expected-count'; then
              if [ -z "$EXPECTED_COUNT" ] || ! echo "$EXPECTED_COUNT" | grep -qE '^[0-9]+$'; then
                echo "ERROR: expected_count must be a non-negative integer when script contains --expected-count" >&2
                exit 1
              fi
              SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--expected-count/--expected-count $EXPECTED_COUNT/")
            fi
          fi

          # backfill-confirm-on-verify --limit/--expected-count(Issue #1034/#1043、
          # backfill-drive-exportと同一のcanary安全策)。値省略は誤操作(無制限全件処理)に
          # つながるため、backfill-drive-exportと同一パターンで明示値を必須化する。
          if [ "$SCRIPT_NAME" = "backfill-confirm-on-verify" ] || [ "$SCRIPT_NAME" = "backfill-customer-id-link" ]; then
            if echo "$SCRIPT_ARGS" | grep -q -- '--limit'; then
              if [ -z "$BACKFILL_LIMIT" ] || ! echo "$BACKFILL_LIMIT" | grep -qE '^[0-9]+$'; then
                echo "ERROR: backfill_limit must be a non-negative integer when script contains --limit" >&2
                exit 1
              fi
              SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--limit/--limit $BACKFILL_LIMIT/")
            fi
            if echo "$SCRIPT_ARGS" | grep -q -- '--expected-count'; then
              if [ -z "$EXPECTED_COUNT" ] || ! echo "$EXPECTED_COUNT" | grep -qE '^[0-9]+$'; then
                echo "ERROR: expected_count must be a non-negative integer when script contains --expected-count" >&2
                exit 1
              fi
              SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--expected-count/--expected-count $EXPECTED_COUNT/")
            fi
          fi

          # classify-drive-export-drift --limit(Issue #811/#823 remediation)。数値のみなので
          # backfill-drive-exportと同一パターンでbackfill_limit入力をここで安全に置換できる。
          # --care-manager(ケアマネ名、スペースを含みうる)はここではsed置換しない
          # (置換後にSCRIPT_ARGSをunquotedでword-split展開すると名前がスペースで分割されて
          # 壊れるため、investigate-caremanager-folder-duplicateと同様にRun scriptステップ側で
          # bash配列として`"$NAME1"`をクォート付きで直接組み立てる)。
          if [ "$SCRIPT_NAME" = "classify-drive-export-drift" ]; then
            if echo "$SCRIPT_ARGS" | grep -q -- '--limit'; then
              if [ -z "$BACKFILL_LIMIT" ] || ! echo "$BACKFILL_LIMIT" | grep -qE '^[0-9]+$'; then
                echo "ERROR: backfill_limit must be a non-negative integer when script contains --limit" >&2
                exit 1
              fi
              SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--limit/--limit $BACKFILL_LIMIT/")
            fi
          fi

          # execute-drive-export-repair --limit/--expected-count(Issue #811/#823
          # remediation Phase 2b)。backfill-drive-exportと同一パターン(数値のみなので
          # sed置換で安全)。--plan(classify plan artifact)/--expected-total/
          # --acknowledge-restore-foldersはexec_args_json経由でParse execute-drive-export-repair
          # argsステップが扱う(このステップでは--limit/--expected-countのみ)。
          if [ "$SCRIPT_NAME" = "execute-drive-export-repair" ]; then
            if echo "$SCRIPT_ARGS" | grep -q -- '--limit'; then
              if [ -z "$BACKFILL_LIMIT" ] || ! echo "$BACKFILL_LIMIT" | grep -qE '^[0-9]+$'; then
                echo "ERROR: backfill_limit must be a non-negative integer when script contains --limit" >&2
                exit 1
              fi
              SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--limit/--limit $BACKFILL_LIMIT/")
            fi
            if echo "$SCRIPT_ARGS" | grep -q -- '--expected-count'; then
              if [ -z "$EXPECTED_COUNT" ] || ! echo "$EXPECTED_COUNT" | grep -qE '^[0-9]+$'; then
                echo "ERROR: expected_count must be a non-negative integer when script contains --expected-count" >&2
                exit 1
              fi
              SCRIPT_ARGS=$(echo "$SCRIPT_ARGS" | sed "s/--expected-count/--expected-count $EXPECTED_COUNT/")
            fi
          fi

          echo "script_name=$SCRIPT_NAME" >> "$GITHUB_OUTPUT"
          echo "script_args=$SCRIPT_ARGS" >> "$GITHUB_OUTPUT"
          echo "Script: $SCRIPT_NAME"
          echo "Args: $SCRIPT_ARGS"

      - name: Parse execute-collision-migration args
        # Issue #432 PR-C2-execution: exec_args_json から planRunId と
        # approvedOperationIds を抽出する。後段の Download artifact + Generate
        # approval JSON で参照。
        id: parse_exec
        if: ${{ startsWith(github.event.inputs.script, 'execute-collision-migration') }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
          SCRIPT_NAME: ${{ steps.parse.outputs.script_name }}
        run: |
          set -euo pipefail
          if [ -z "$EXEC_ARGS_JSON" ]; then
            echo "ERROR: exec_args_json is required when script is execute-collision-migration" >&2
            exit 1
          fi
          # JSON validate + 抽出 (jq は ubuntu-latest に標準搭載)
          if ! echo "$EXEC_ARGS_JSON" | jq empty 2>/dev/null; then
            echo "ERROR: exec_args_json is not valid JSON" >&2
            exit 1
          fi
          PLAN_RUN_ID=$(echo "$EXEC_ARGS_JSON" | jq -r '.planRunId // empty')
          OPERATION_IDS=$(echo "$EXEC_ARGS_JSON" | jq -r '.approvedOperationIds // empty | join(",")')
          if [ -z "$PLAN_RUN_ID" ] || [ -z "$OPERATION_IDS" ]; then
            echo "ERROR: exec_args_json must contain planRunId (string) and approvedOperationIds (array)" >&2
            exit 1
          fi
          # planRunId は GitHub Actions run id (数字のみ) — path traversal / injection 防止
          if ! echo "$PLAN_RUN_ID" | grep -qE '^[0-9]+$'; then
            echo "ERROR: planRunId must be a numeric run id (got: $PLAN_RUN_ID)" >&2
            exit 1
          fi
          # operationId は op-NNNN 形式のみ許可
          if ! echo "$OPERATION_IDS" | grep -qE '^op-[0-9]+(,op-[0-9]+)*$'; then
            echo "ERROR: approvedOperationIds must each match ^op-[0-9]+$ (got: $OPERATION_IDS)" >&2
            exit 1
          fi
          echo "plan_run_id=$PLAN_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "operation_ids_csv=$OPERATION_IDS" >> "$GITHUB_OUTPUT"
          echo "Plan run id: $PLAN_RUN_ID"
          echo "Approved operation ids: $OPERATION_IDS"

      - name: Download classify-collision-docs plan artifact
        # exec_args_json.planRunId で指定された前段 classify run の plan-output.json を取得。
        # Artifact 名は upload 側 (上記 Upload step) と一致させる。
        if: ${{ startsWith(github.event.inputs.script, 'execute-collision-migration') }}
        uses: actions/download-artifact@v4
        with:
          name: classify-collision-docs-plan-${{ github.event.inputs.environment }}-${{ steps.parse_exec.outputs.plan_run_id }}
          path: ${{ github.workspace }}/.exec-plan
          run-id: ${{ steps.parse_exec.outputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate survey_artifact_run_id (for classify-collision-docs)
        # PR-C3c (AC15-1): classify-collision-docs は --survey-artifact 必須化されたため、
        # 前段 pdf-feature-survey の workflow run ID を入力で受け取る。run-id は数値のみ許可
        # (path traversal / injection 防止)。
        if: ${{ github.event.inputs.script == 'classify-collision-docs' }}
        env:
          SURVEY_RUN_ID: ${{ github.event.inputs.survey_artifact_run_id }}
        run: |
          set -euo pipefail
          if [ -z "$SURVEY_RUN_ID" ]; then
            echo "ERROR: survey_artifact_run_id is required for classify-collision-docs (PR-C3c AC15-1)" >&2
            exit 1
          fi
          if ! [[ "$SURVEY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: survey_artifact_run_id must be numeric run ID (got: \"$SURVEY_RUN_ID\")" >&2
            exit 1
          fi
          echo "survey_artifact_run_id validated: $SURVEY_RUN_ID"

      - name: Download pdf-feature-survey artifact (for classify-collision-docs)
        # PR-C3c (AC15-1): classify は前段 pdf-feature-survey run の output JSON を必須入力
        # として読む (--survey-artifact 引数で渡す)。Artifact 名は survey 側 upload と一致。
        if: ${{ github.event.inputs.script == 'classify-collision-docs' }}
        uses: actions/download-artifact@v4
        with:
          name: pdf-feature-survey-${{ github.event.inputs.environment }}-${{ github.event.inputs.survey_artifact_run_id }}
          path: ${{ github.workspace }}/.survey-artifact
          run-id: ${{ github.event.inputs.survey_artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate approval JSON from plan + approved operation ids
        # plan-output.json の operations 配列から approvedOperationIds に該当する op を
        # 抽出し、その planId + opIds + (sourcePath/destPath を gs://bucket/path で展開) を
        # approval.json に書き出す。execute-collision-migration.ts の Gate 1-3 を満たす形式。
        if: ${{ startsWith(github.event.inputs.script, 'execute-collision-migration') }}
        env:
          OPERATION_IDS_CSV: ${{ steps.parse_exec.outputs.operation_ids_csv }}
          STORAGE_BUCKET: ${{ steps.resolve.outputs.storage_bucket }}
        run: |
          set -euo pipefail
          PLAN_FILE="${GITHUB_WORKSPACE}/.exec-plan/plan-output.json"
          APPROVAL_FILE="${GITHUB_WORKSPACE}/.exec-plan/approval.json"
          if [ ! -f "$PLAN_FILE" ]; then
            echo "ERROR: plan-output.json not found at $PLAN_FILE" >&2
            exit 1
          fi
          # CSV → JSON array of strings
          OP_IDS_JSON=$(echo "$OPERATION_IDS_CSV" | jq -R 'split(",")')
          # planId は plan から、approvedPaths は該当 op の sourcePath/destPath を gs:// 形式で集合化
          jq --argjson opids "$OP_IDS_JSON" --arg bucket "$STORAGE_BUCKET" '
            {
              planId: .planId,
              approvedOperationIds: $opids,
              approvedPaths: [
                .operations[]
                | select(.operationId as $id | $opids | index($id))
                | (.sourcePath, .destPath)
                | select(. != null and . != "")
                | "gs://\($bucket)/\(.)"
              ] | unique
            }
          ' "$PLAN_FILE" > "$APPROVAL_FILE"
          # 確認用 (path をログに出すことで監査証跡を残す)
          echo "=== Generated approval.json ==="
          cat "$APPROVAL_FILE"
          echo "==============================="
          # approvedOperationIds の数 = 入力 opId 数 を検証 (plan に存在しない opId は警告)
          INPUT_COUNT=$(echo "$OP_IDS_JSON" | jq 'length')
          MATCHED_COUNT=$(jq '[.operations[] | select(.operationId as $id | ('"$OP_IDS_JSON"' | index($id))) ] | length' "$PLAN_FILE")
          if [ "$INPUT_COUNT" != "$MATCHED_COUNT" ]; then
            echo "ERROR: $INPUT_COUNT operation ids requested but only $MATCHED_COUNT matched in plan" >&2
            exit 1
          fi

      - name: Parse classify-drive-folder-duplicates args
        # Issue #811 Phase B: exec_args_json から canonicalFolderId/duplicateFolderIds を抽出する。
        id: parse_classify_drive
        if: ${{ github.event.inputs.script == 'classify-drive-folder-duplicates' }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
        run: |
          set -euo pipefail
          if [ -z "$EXEC_ARGS_JSON" ]; then
            echo "ERROR: exec_args_json is required when script is classify-drive-folder-duplicates" >&2
            exit 1
          fi
          if ! echo "$EXEC_ARGS_JSON" | jq empty 2>/dev/null; then
            echo "ERROR: exec_args_json is not valid JSON" >&2
            exit 1
          fi
          CANONICAL_ID=$(echo "$EXEC_ARGS_JSON" | jq -r '.canonicalFolderId // empty')
          DUPLICATE_IDS=$(echo "$EXEC_ARGS_JSON" | jq -r '.duplicateFolderIds // empty | join(",")')
          if [ -z "$CANONICAL_ID" ] || [ -z "$DUPLICATE_IDS" ]; then
            echo "ERROR: exec_args_json must contain canonicalFolderId (string) and duplicateFolderIds (array)" >&2
            exit 1
          fi
          # Drive file id は英数字/ハイフン/アンダースコアのみ許可(コマンドインジェクション対策)
          if ! echo "$CANONICAL_ID" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "ERROR: canonicalFolderId contains invalid characters" >&2
            exit 1
          fi
          if ! echo "$DUPLICATE_IDS" | grep -qE '^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$'; then
            echo "ERROR: duplicateFolderIds contains invalid characters" >&2
            exit 1
          fi
          echo "canonical_folder_id=$CANONICAL_ID" >> "$GITHUB_OUTPUT"
          echo "duplicate_folder_ids_csv=$DUPLICATE_IDS" >> "$GITHUB_OUTPUT"

      - name: Parse execute-drive-folder-merge args
        # Issue #811 Phase B: exec_args_json から planRunId(classify-drive-folder-duplicates run id)
        # と approvedOperationIds を抽出する。execute-collision-migration の parse_exec と同型。
        id: parse_exec_drive
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-folder-merge') }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
        run: |
          set -euo pipefail
          if [ -z "$EXEC_ARGS_JSON" ]; then
            echo "ERROR: exec_args_json is required when script is execute-drive-folder-merge" >&2
            exit 1
          fi
          if ! echo "$EXEC_ARGS_JSON" | jq empty 2>/dev/null; then
            echo "ERROR: exec_args_json is not valid JSON" >&2
            exit 1
          fi
          PLAN_RUN_ID=$(echo "$EXEC_ARGS_JSON" | jq -r '.planRunId // empty')
          if [ -z "$PLAN_RUN_ID" ]; then
            echo "ERROR: exec_args_json must contain planRunId (string)" >&2
            exit 1
          fi
          if ! echo "$PLAN_RUN_ID" | grep -qE '^[0-9]+$'; then
            echo "ERROR: planRunId must be a numeric run id (got: $PLAN_RUN_ID)" >&2
            exit 1
          fi
          # codex review 6巡目P2指摘対応: duplicateフォルダが既にfile 0件(classify結果が
          # operations 0件)の場合、approvedOperationIdsは正当に空配列になりうる
          # (rename-onlyの最終確定に必要)。空配列自体をエラー扱いにしない。フィールド
          # 自体が存在しない/配列でない場合のみエラーとする。
          HAS_VALID_OP_IDS_FIELD=$(echo "$EXEC_ARGS_JSON" | jq '(.approvedOperationIds // null) | type == "array"')
          if [ "$HAS_VALID_OP_IDS_FIELD" != "true" ]; then
            echo "ERROR: exec_args_json must contain approvedOperationIds (array, may be empty for a zero-operation plan)" >&2
            exit 1
          fi
          OPERATION_IDS=$(echo "$EXEC_ARGS_JSON" | jq -r '.approvedOperationIds | join(",")')
          if [ -n "$OPERATION_IDS" ] && ! echo "$OPERATION_IDS" | grep -qE '^op-[0-9]+(,op-[0-9]+)*$'; then
            echo "ERROR: approvedOperationIds must each match ^op-[0-9]+$ (got: $OPERATION_IDS)" >&2
            exit 1
          fi
          echo "plan_run_id=$PLAN_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "operation_ids_csv=$OPERATION_IDS" >> "$GITHUB_OUTPUT"

      - name: Download classify-drive-folder-duplicates plan artifact
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-folder-merge') }}
        uses: actions/download-artifact@v4
        with:
          name: classify-drive-folder-duplicates-plan-${{ github.event.inputs.environment }}-${{ steps.parse_exec_drive.outputs.plan_run_id }}
          path: ${{ github.workspace }}/.drive-merge-plan
          run-id: ${{ steps.parse_exec_drive.outputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse execute-drive-claim-resync args
        # Issue #871 恒久対応: exec_args_json から planRunId(classify-drive-claim-divergence
        # run id)を抽出する。approvedOperationsのJSON本体はGITHUB_OUTPUT経由での多段
        # エスケープを避けるため、後続stepで github.event.inputs.exec_args_json を直接
        # 再パースする(planRunIdのみここでnumeric検証してoutputに残す)。
        id: parse_exec_divergence
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-claim-resync') }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
        run: |
          set -euo pipefail
          if [ -z "$EXEC_ARGS_JSON" ]; then
            echo "ERROR: exec_args_json is required when script is execute-drive-claim-resync" >&2
            exit 1
          fi
          if ! echo "$EXEC_ARGS_JSON" | jq empty 2>/dev/null; then
            echo "ERROR: exec_args_json is not valid JSON" >&2
            exit 1
          fi
          PLAN_RUN_ID=$(echo "$EXEC_ARGS_JSON" | jq -r '.planRunId // empty')
          if [ -z "$PLAN_RUN_ID" ]; then
            echo "ERROR: exec_args_json must contain planRunId (string)" >&2
            exit 1
          fi
          if ! echo "$PLAN_RUN_ID" | grep -qE '^[0-9]+$'; then
            echo "ERROR: planRunId must be a numeric run id (got: $PLAN_RUN_ID)" >&2
            exit 1
          fi
          HAS_VALID_APPROVED_OPS=$(echo "$EXEC_ARGS_JSON" | jq '(.approvedOperations // null) | type == "object"')
          if [ "$HAS_VALID_APPROVED_OPS" != "true" ]; then
            echo "ERROR: exec_args_json must contain approvedOperations (object, may be {} for a zero-approval dry-run)" >&2
            exit 1
          fi
          # operationIdは^op-[0-9]+$、modeは既知の3値、acknowledgedStrandedFilesは
          # 指定時は0以上の整数のみ許可(誤操作・インジェクション対策)。
          INVALID_KEYS=$(echo "$EXEC_ARGS_JSON" | jq -r '.approvedOperations | keys[] | select(test("^op-[0-9]+$") | not)')
          if [ -n "$INVALID_KEYS" ]; then
            echo "ERROR: approvedOperations keys must each match ^op-[0-9]+$ (invalid: $INVALID_KEYS)" >&2
            exit 1
          fi
          INVALID_MODES=$(echo "$EXEC_ARGS_JSON" | jq -r '.approvedOperations[] | .mode | select(. as $m | ["restore-expected","release-claim","finalize-resolved"] | index($m) | not)')
          if [ -n "$INVALID_MODES" ]; then
            echo "ERROR: approvedOperations[].mode must be one of restore-expected/release-claim/finalize-resolved (invalid: $INVALID_MODES)" >&2
            exit 1
          fi
          INVALID_ACK=$(echo "$EXEC_ARGS_JSON" | jq -r '.approvedOperations[] | select(has("acknowledgedStrandedFiles")) | .acknowledgedStrandedFiles | select((type != "number") or (. < 0) or (floor != .))')
          if [ -n "$INVALID_ACK" ]; then
            echo "ERROR: approvedOperations[].acknowledgedStrandedFiles must be a non-negative integer when present" >&2
            exit 1
          fi
          echo "plan_run_id=$PLAN_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download classify-drive-claim-divergence plan artifact
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-claim-resync') }}
        uses: actions/download-artifact@v4
        with:
          name: classify-drive-claim-divergence-plan-${{ github.event.inputs.environment }}-${{ steps.parse_exec_divergence.outputs.plan_run_id }}
          path: ${{ github.workspace }}/.divergence-plan
          run-id: ${{ steps.parse_exec_divergence.outputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate approval JSON from divergence plan + exec_args_json
        # plan.planId + exec_args_json.approvedOperations を合成してapproval.jsonに書き出す。
        # execute-drive-claim-resync.tsのschemaVersion/planId/projectId gateを満たす形式。
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-claim-resync') }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
        run: |
          set -euo pipefail
          PLAN_FILE="${GITHUB_WORKSPACE}/.divergence-plan/plan-output.json"
          APPROVAL_FILE="${GITHUB_WORKSPACE}/.divergence-plan/approval.json"
          if [ ! -f "$PLAN_FILE" ]; then
            echo "ERROR: plan-output.json not found at $PLAN_FILE" >&2
            exit 1
          fi
          PLAN_ID=$(jq -r '.planId' "$PLAN_FILE")
          echo "$EXEC_ARGS_JSON" | jq --arg planId "$PLAN_ID" '{planId: $planId, approvedOperations: .approvedOperations}' > "$APPROVAL_FILE"
          echo "=== Generated approval.json ==="
          cat "$APPROVAL_FILE"
          echo "==============================="
          # 承認されたoperationIdが実際にplanに存在するかを確認する(pr-review-toolkit:
          # code-reviewer Important指摘対応。execute-drive-folder-merge/execute-collision-migration
          # の同種チェックと揃える)。存在しないIDを承認してもexecute-drive-claim-resync.ts側は
          # 単にそのoperationを黙ってスキップするだけで、承認者が意図した操作が実行されない
          # ままrunがexit 0で終わりうる。
          INPUT_COUNT=$(jq '.approvedOperations | keys | length' "$APPROVAL_FILE")
          MATCHED_COUNT=$(jq --slurpfile approval "$APPROVAL_FILE" '[.operations[] | select(.operationId as $id | ($approval[0].approvedOperations | has($id)))] | length' "$PLAN_FILE")
          if [ "$INPUT_COUNT" != "$MATCHED_COUNT" ]; then
            echo "ERROR: $INPUT_COUNT operation ids approved but only $MATCHED_COUNT matched in plan" >&2
            exit 1
          fi

      - name: Parse execute-drive-sibling-merge args
        # Issue #1028(ADR-0028): exec_args_json から planRunId(audit-drive-sibling-duplicates
        # run id)を抽出する。approvedGroupIdsはgroupId(parentId:name形式、日本語フォルダ名を
        # 含みうる)のJSON配列のため、CSV化はせず後続stepでexec_args_jsonを直接再パースする
        # (execute-drive-claim-resyncのapprovedOperationsと同型の方針)。
        id: parse_exec_sibling
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-sibling-merge') }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
        run: |
          set -euo pipefail
          if [ -z "$EXEC_ARGS_JSON" ]; then
            echo "ERROR: exec_args_json is required when script is execute-drive-sibling-merge" >&2
            exit 1
          fi
          if ! echo "$EXEC_ARGS_JSON" | jq empty 2>/dev/null; then
            echo "ERROR: exec_args_json is not valid JSON" >&2
            exit 1
          fi
          PLAN_RUN_ID=$(echo "$EXEC_ARGS_JSON" | jq -r '.planRunId // empty')
          if [ -z "$PLAN_RUN_ID" ]; then
            echo "ERROR: exec_args_json must contain planRunId (string)" >&2
            exit 1
          fi
          if ! echo "$PLAN_RUN_ID" | grep -qE '^[0-9]+$'; then
            echo "ERROR: planRunId must be a numeric run id (got: $PLAN_RUN_ID)" >&2
            exit 1
          fi
          HAS_VALID_GROUP_IDS=$(echo "$EXEC_ARGS_JSON" | jq '(.approvedGroupIds // null) | type == "array"')
          if [ "$HAS_VALID_GROUP_IDS" != "true" ]; then
            echo "ERROR: exec_args_json must contain approvedGroupIds (array, may be empty for a zero-approval dry-run)" >&2
            exit 1
          fi
          echo "plan_run_id=$PLAN_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download audit-drive-sibling-duplicates plan artifact
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-sibling-merge') }}
        uses: actions/download-artifact@v4
        with:
          name: audit-drive-sibling-duplicates-plan-${{ github.event.inputs.environment }}-${{ steps.parse_exec_sibling.outputs.plan_run_id }}
          path: ${{ github.workspace }}/.sibling-merge-plan
          run-id: ${{ steps.parse_exec_sibling.outputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate approval JSON from sibling duplicate plan + exec_args_json
        # plan.planId + exec_args_json.approvedGroupIdsを合成してapproval.jsonに書き出す。
        # execute-drive-sibling-merge.tsのschemaVersion/planId gateを満たす形式。
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-sibling-merge') }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
        run: |
          set -euo pipefail
          PLAN_FILE="${GITHUB_WORKSPACE}/.sibling-merge-plan/plan-output.json"
          APPROVAL_FILE="${GITHUB_WORKSPACE}/.sibling-merge-plan/approval.json"
          if [ ! -f "$PLAN_FILE" ]; then
            echo "ERROR: plan-output.json not found at $PLAN_FILE" >&2
            exit 1
          fi
          PLAN_ID=$(jq -r '.planId' "$PLAN_FILE")
          echo "$EXEC_ARGS_JSON" | jq --arg planId "$PLAN_ID" '{planId: $planId, approvedGroupIds: .approvedGroupIds}' > "$APPROVAL_FILE"
          echo "=== Generated approval.json ==="
          cat "$APPROVAL_FILE"
          echo "==============================="
          # 承認されたgroupIdが実際にplanのmerge対象groupに存在するかを確認する
          # (execute-drive-folder-merge/execute-drive-claim-resyncの同種チェックと揃える)。
          INPUT_COUNT=$(jq '.approvedGroupIds | length' "$APPROVAL_FILE")
          MATCHED_COUNT=$(jq --slurpfile approval "$APPROVAL_FILE" '[.groups[] | select(.action == "merge") | select(.groupId as $id | ($approval[0].approvedGroupIds | index($id)))] | length' "$PLAN_FILE")
          if [ "$INPUT_COUNT" != "$MATCHED_COUNT" ]; then
            echo "ERROR: $INPUT_COUNT group ids approved but only $MATCHED_COUNT matched merge-eligible groups in plan" >&2
            exit 1
          fi

      - name: Parse execute-drive-folder-tree-merge args
        # 再帰統合(同名の兄弟フォルダ2つ)。exec_args_jsonからplanRunId(plan-drive-folder-tree-merge
        # run id)と承認件数(plan出力と一致必須)を抽出する。件数はplan artifactと突合してから承認JSONにする。
        id: parse_exec_tree
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-folder-tree-merge') }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
        run: |
          set -euo pipefail
          if [ -z "$EXEC_ARGS_JSON" ]; then
            echo "ERROR: exec_args_json is required when script is execute-drive-folder-tree-merge" >&2
            exit 1
          fi
          if ! echo "$EXEC_ARGS_JSON" | jq empty 2>/dev/null; then
            echo "ERROR: exec_args_json is not valid JSON" >&2
            exit 1
          fi
          PLAN_RUN_ID=$(echo "$EXEC_ARGS_JSON" | jq -r '.planRunId // empty')
          if ! echo "$PLAN_RUN_ID" | grep -qE '^[0-9]+$'; then
            echo "ERROR: planRunId must be a numeric run id (got: $PLAN_RUN_ID)" >&2
            exit 1
          fi
          for KEY in expectedFileMoves expectedFolderMoves expectedFolderTrashes; do
            if [ "$(echo "$EXEC_ARGS_JSON" | jq -r --arg k "$KEY" '(.[$k] // null) | type == "number" and . >= 0 and . == floor')" != "true" ]; then
              echo "ERROR: exec_args_json must contain $KEY (non-negative integer)" >&2
              exit 1
            fi
          done
          echo "plan_run_id=$PLAN_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download plan-drive-folder-tree-merge plan artifact
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-folder-tree-merge') }}
        uses: actions/download-artifact@v4
        with:
          name: plan-drive-folder-tree-merge-plan-${{ github.event.inputs.environment }}-${{ steps.parse_exec_tree.outputs.plan_run_id }}
          path: ${{ github.workspace }}/.tree-merge-plan
          run-id: ${{ steps.parse_exec_tree.outputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate approval JSON from folder tree merge plan + exec_args_json
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-folder-tree-merge') }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
        run: |
          set -euo pipefail
          PLAN_FILE="${GITHUB_WORKSPACE}/.tree-merge-plan/plan-output.json"
          APPROVAL_FILE="${GITHUB_WORKSPACE}/.tree-merge-plan/approval.json"
          if [ ! -f "$PLAN_FILE" ]; then
            echo "ERROR: plan-output.json not found at $PLAN_FILE" >&2
            exit 1
          fi
          PLAN_ID=$(jq -r '.planId' "$PLAN_FILE")
          echo "$EXEC_ARGS_JSON" | jq --arg planId "$PLAN_ID" '{planId: $planId, expectedFileMoves: .expectedFileMoves, expectedFolderMoves: .expectedFolderMoves, expectedFolderTrashes: .expectedFolderTrashes}' > "$APPROVAL_FILE"
          echo "=== Generated approval.json ==="
          cat "$APPROVAL_FILE"
          echo "==============================="
          # 承認件数がplanと一致しなければ実行前に停止(件数を読まずに承認する事故の防止)
          MISMATCH=$(jq --slurpfile a "$APPROVAL_FILE" '(.summary.fileMoves != $a[0].expectedFileMoves) or (.summary.folderMoves != $a[0].expectedFolderMoves) or (.summary.folderTrashes != $a[0].expectedFolderTrashes)' "$PLAN_FILE")
          if [ "$MISMATCH" != "false" ]; then
            echo "ERROR: approved counts do not match plan summary" >&2
            exit 1
          fi

      - name: Parse execute-drive-export-repair args
        # Issue #811/#823 remediation Phase 2b: exec_args_json から
        # planRunId(classify-drive-export-drift run id、必須)・expectedTotal(任意、H5の
        # limit適用前母数ガード)・acknowledgeRestoreFolders(任意、D7)を抽出する。
        # execute-drive-folder-mergeのparse_exec_driveと同型だが、D5の方針(approval.json級の
        # 重量ゲートは不採用)により承認オペレーションID抽出は行わない。
        id: parse_exec_repair
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-export-repair') }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
        run: |
          set -euo pipefail
          if [ -z "$EXEC_ARGS_JSON" ]; then
            echo "ERROR: exec_args_json is required when script is execute-drive-export-repair" >&2
            exit 1
          fi
          if ! echo "$EXEC_ARGS_JSON" | jq empty 2>/dev/null; then
            echo "ERROR: exec_args_json is not valid JSON" >&2
            exit 1
          fi
          PLAN_RUN_ID=$(echo "$EXEC_ARGS_JSON" | jq -r '.planRunId // empty')
          if [ -z "$PLAN_RUN_ID" ]; then
            echo "ERROR: exec_args_json must contain planRunId (string)" >&2
            exit 1
          fi
          if ! echo "$PLAN_RUN_ID" | grep -qE '^[0-9]+$'; then
            echo "ERROR: planRunId must be a numeric run id (got: $PLAN_RUN_ID)" >&2
            exit 1
          fi
          EXPECTED_TOTAL=$(echo "$EXEC_ARGS_JSON" | jq -r '.expectedTotal // empty')
          if [ -n "$EXPECTED_TOTAL" ] && ! echo "$EXPECTED_TOTAL" | grep -qE '^[0-9]+$'; then
            echo "ERROR: expectedTotal must be a non-negative integer when present (got: $EXPECTED_TOTAL)" >&2
            exit 1
          fi
          ACKNOWLEDGE_RESTORE=$(echo "$EXEC_ARGS_JSON" | jq -r '.acknowledgeRestoreFolders // false')
          echo "plan_run_id=$PLAN_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "expected_total=$EXPECTED_TOTAL" >> "$GITHUB_OUTPUT"
          echo "acknowledge_restore=$ACKNOWLEDGE_RESTORE" >> "$GITHUB_OUTPUT"

      - name: Download classify-drive-export-drift plan artifact for execute-drive-export-repair
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-export-repair') }}
        uses: actions/download-artifact@v4
        with:
          name: classify-drive-export-drift-plan-${{ github.event.inputs.environment }}-${{ steps.parse_exec_repair.outputs.plan_run_id }}
          path: ${{ github.workspace }}/.drive-export-repair-plan
          run-id: ${{ steps.parse_exec_repair.outputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate approval JSON from drive folder merge plan + approved operation ids
        # plan-output.json の operations 配列から approvedOperationIds に該当する op を抽出し、
        # planId + opIds + (expectedParents[0]/driveFileId を drive://folderId/fileId で展開) を
        # approval.json に書き出す。execute-drive-folder-merge.ts の Gate 1-3 を満たす形式。
        if: ${{ startsWith(github.event.inputs.script, 'execute-drive-folder-merge') }}
        env:
          OPERATION_IDS_CSV: ${{ steps.parse_exec_drive.outputs.operation_ids_csv }}
        run: |
          set -euo pipefail
          PLAN_FILE="${GITHUB_WORKSPACE}/.drive-merge-plan/plan-output.json"
          APPROVAL_FILE="${GITHUB_WORKSPACE}/.drive-merge-plan/approval.json"
          if [ ! -f "$PLAN_FILE" ]; then
            echo "ERROR: plan-output.json not found at $PLAN_FILE" >&2
            exit 1
          fi
          # codex review 6巡目P2指摘対応: OPERATION_IDS_CSVが空文字列の場合
          # `jq -R 'split(",")'` は`[""]`(空文字列1件の配列)を返してしまい、
          # 意図した`[]`(0件承認=zero-operation plan)にならない。空の場合は
          # 明示的に`[]`とする。
          if [ -z "$OPERATION_IDS_CSV" ]; then
            OP_IDS_JSON='[]'
          else
            OP_IDS_JSON=$(echo "$OPERATION_IDS_CSV" | jq -R 'split(",")')
          fi
          jq --argjson opids "$OP_IDS_JSON" '
            {
              planId: .planId,
              approvedOperationIds: $opids,
              approvedPaths: [
                .operations[]
                | select(.operationId as $id | $opids | index($id))
                | select(.expectedParents[0] != null)
                | "drive://\(.expectedParents[0])/\(.driveFileId)"
              ] | unique
            }
          ' "$PLAN_FILE" > "$APPROVAL_FILE"
          echo "=== Generated approval.json ==="
          cat "$APPROVAL_FILE"
          echo "==============================="
          INPUT_COUNT=$(echo "$OP_IDS_JSON" | jq 'length')
          MATCHED_COUNT=$(jq '[.operations[] | select(.operationId as $id | ('"$OP_IDS_JSON"' | index($id))) ] | length' "$PLAN_FILE")
          if [ "$INPUT_COUNT" != "$MATCHED_COUNT" ]; then
            echo "ERROR: $INPUT_COUNT operation ids requested but only $MATCHED_COUNT matched in plan" >&2
            exit 1
          fi

      - name: Parse rollback-drive-folder-merge args
        id: parse_rollback_drive
        if: ${{ startsWith(github.event.inputs.script, 'rollback-drive-folder-merge') }}
        env:
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
        run: |
          set -euo pipefail
          if [ -z "$EXEC_ARGS_JSON" ]; then
            echo "ERROR: exec_args_json is required when script is rollback-drive-folder-merge" >&2
            exit 1
          fi
          if ! echo "$EXEC_ARGS_JSON" | jq empty 2>/dev/null; then
            echo "ERROR: exec_args_json is not valid JSON" >&2
            exit 1
          fi
          MANIFEST_RUN_ID=$(echo "$EXEC_ARGS_JSON" | jq -r '.manifestRunId // empty')
          if [ -z "$MANIFEST_RUN_ID" ]; then
            echo "ERROR: exec_args_json must contain manifestRunId (string)" >&2
            exit 1
          fi
          if ! echo "$MANIFEST_RUN_ID" | grep -qE '^[0-9]+$'; then
            echo "ERROR: manifestRunId must be a numeric run id (got: $MANIFEST_RUN_ID)" >&2
            exit 1
          fi
          # approvedOperationIds は省略可(省略時はmanifest全件をrollback対象にする)
          OPERATION_IDS=$(echo "$EXEC_ARGS_JSON" | jq -r '.approvedOperationIds // empty | join(",")')
          if [ -n "$OPERATION_IDS" ] && ! echo "$OPERATION_IDS" | grep -qE '^op-[0-9]+(,op-[0-9]+)*$'; then
            echo "ERROR: approvedOperationIds must each match ^op-[0-9]+$ (got: $OPERATION_IDS)" >&2
            exit 1
          fi
          echo "manifest_run_id=$MANIFEST_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "operation_ids_csv=$OPERATION_IDS" >> "$GITHUB_OUTPUT"

      - name: Download execute-drive-folder-merge manifest artifact
        if: ${{ startsWith(github.event.inputs.script, 'rollback-drive-folder-merge') }}
        uses: actions/download-artifact@v4
        with:
          name: execute-drive-folder-merge-manifest-${{ github.event.inputs.environment }}-${{ steps.parse_rollback_drive.outputs.manifest_run_id }}
          path: ${{ github.workspace }}/.drive-merge-manifest
          run-id: ${{ steps.parse_rollback_drive.outputs.manifest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run script
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          PROJECT_ID: ${{ steps.resolve.outputs.project_id }}
          SCRIPT_NAME: ${{ steps.parse.outputs.script_name }}
          SCRIPT_ARGS: ${{ steps.parse.outputs.script_args }}
          NAME1: ${{ github.event.inputs.name1 }}
          NAME2: ${{ github.event.inputs.name2 }}
          FROM_NAME: ${{ github.event.inputs.from_name }}
          TO_NAME: ${{ github.event.inputs.to_name }}
          DELETE_FROM_MASTER: ${{ github.event.inputs.delete_from_master }}
          EXPECTED_COUNT: ${{ github.event.inputs.expected_count }}
          FILE_NAME: ${{ github.event.inputs.file_name }}
          DOC_ID: ${{ github.event.inputs.doc_id }}
          STORAGE_BUCKET: ${{ steps.resolve.outputs.storage_bucket }}
          OPERATION_IDS_CSV: ${{ steps.parse_exec.outputs.operation_ids_csv }}
          DELETE_IDS: ${{ github.event.inputs.delete_ids }}
          OFFICE_NAMES: ${{ github.event.inputs.office_names }}
          OFFICE_IDS: ${{ github.event.inputs.office_ids }}
          MARKED_BY: ${{ github.event.inputs.marked_by }}
          RUN_ID_FOR_ROLLBACK: ${{ github.event.inputs.run_id_for_rollback }}
          REBUILD_GROUP_IDS: ${{ github.event.inputs.rebuild_group_ids }}
          EXEC_ARGS_JSON: ${{ github.event.inputs.exec_args_json }}
          CANONICAL_FOLDER_ID: ${{ steps.parse_classify_drive.outputs.canonical_folder_id }}
          DUPLICATE_FOLDER_IDS_CSV: ${{ steps.parse_classify_drive.outputs.duplicate_folder_ids_csv }}
          DRIVE_OPERATION_IDS_CSV: ${{ steps.parse_exec_drive.outputs.operation_ids_csv }}
          MANIFEST_RUN_ID: ${{ steps.parse_rollback_drive.outputs.manifest_run_id }}
          ROLLBACK_OPERATION_IDS_CSV: ${{ steps.parse_rollback_drive.outputs.operation_ids_csv }}
          REPAIR_EXPECTED_TOTAL: ${{ steps.parse_exec_repair.outputs.expected_total }}
          REPAIR_ACKNOWLEDGE_RESTORE: ${{ steps.parse_exec_repair.outputs.acknowledge_restore }}
        run: |
          set -euo pipefail
          if [ -z "$PROJECT_ID" ]; then
            echo "ERROR: PROJECT_ID is empty (failed to resolve from .firebaserc)" >&2
            exit 1
          fi
          echo "=== Operations Script ==="
          echo "Environment: $ENVIRONMENT"
          echo "Project ID: $PROJECT_ID"
          echo "Script: $SCRIPT_NAME"
          echo "Args: $SCRIPT_ARGS"
          echo "========================="

          if [ "$SCRIPT_NAME" = "investigate-office-duplicate" ] || [ "$SCRIPT_NAME" = "investigate-caremanager-duplicate" ]; then
            # 空文字 / 空白のみの NAME1 を弾く（trim せずに非空白文字の存在チェック）
            if [[ ! "$NAME1" =~ [^[:space:]] ]]; then
              echo "ERROR: name1 must contain non-whitespace characters for ${SCRIPT_NAME}" >&2
              exit 1
            fi
            ARGS=( --name "$NAME1" )
            if [ -n "$NAME2" ]; then ARGS+=( --name "$NAME2" ); fi
            NODE_PATH=./functions/node_modules \
              FIREBASE_PROJECT_ID="$PROJECT_ID" \
              node "scripts/${SCRIPT_NAME}.js" "${ARGS[@]}"
          elif [ "$SCRIPT_NAME" = "investigate-caremanager-folder-duplicate" ]; then
            # Issue #811 Phase A: 実Driveフォルダの物理状態確認(read-only)。
            # functions/src/drive/{driveAuth,folderPath,driveApiConstants}.ts に依存するため
            # 上記jsスクリプト群(node直接実行)とは異なりts-node経由で実行する。
            if [[ ! "$NAME1" =~ [^[:space:]] ]]; then
              echo "ERROR: name1 must contain non-whitespace characters for investigate-caremanager-folder-duplicate" >&2
              exit 1
            fi
            cd scripts
            NODE_PATH=../functions/node_modules \
              FIREBASE_PROJECT_ID="$PROJECT_ID" \
              npx ts-node investigate-caremanager-folder-duplicate.ts --name "$NAME1"
          elif [ "$SCRIPT_NAME" = "investigate-drive-folder-duplicate-by-name" ]; then
            # kaname報告(2026-09-23、フォルダ名パターンでDrive上の重複を直接調査、read-only)。
            # investigate-caremanager-folder-duplicateと同様ts-node経由。NAME1をクォート付きで
            # --name-containsへ渡す(スペースを含みうる検索語のword-split対策、同型パターン)。
            if [[ ! "$NAME1" =~ [^[:space:]] ]]; then
              echo "ERROR: name1 must contain non-whitespace characters for investigate-drive-folder-duplicate-by-name" >&2
              exit 1
            fi
            cd scripts
            NODE_PATH=../functions/node_modules \
              FIREBASE_PROJECT_ID="$PROJECT_ID" \
              npx ts-node investigate-drive-folder-duplicate-by-name.ts --name-contains "$NAME1" $SCRIPT_ARGS
          elif [ "$SCRIPT_NAME" = "classify-drive-export-drift" ]; then
            # Issue #811/#823 remediation: exported documentの物理状態検査(read-only)。
            # ログマスキングで `{` が `***` に置換されるため、plan JSON をファイル出力 →
