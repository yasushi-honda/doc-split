name: Run Operations Script

# 運用スクリプト汎用ワークフロー
# check-master-data, fix-stuck-documents 等のFirestoreアクセスが必要なスクリプトを
# GitHub Actions経由で実行する。ローカルADC不要。
#
# 環境別SA: GCP_SA_KEY_KANAMEONE / GCP_SA_KEY_DEV / GCP_SA_KEY(cocoro、将来GCP_SA_KEY_COCOROに移行)

on:
  # 注: workflow_dispatch.inputs は GitHub Actions の仕様上 25 個まで定義可能
  # (2025-12-04 拡張、それ以前は 10 個上限)。現在 19 個使用中（environment / script /
  # backfill_limit / doc_id / file_name / name1 / name2 / from_name / to_name /
  # delete_from_master / expected_count / delete_ids / office_names / office_ids /
  # exec_args_json / survey_artifact_run_id / marked_by / run_id_for_rollback /
  # rebuild_group_ids）、残り 6。
  # スクリプト固有の引数追加で上限が窮屈になる場合は、共通 inputs を JSON 文字列に
  # 統合する設計（例: script_args_json）への移行を検討。
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - kanameone
          - cocoro
      script:
        description: 'Script to run'
        required: true
        type: choice
        options:
          - check-master-data
          - check-master-data --fix
          - check-customer-master-integrity
          - merge-notation-duplicate-masters
          - merge-notation-duplicate-masters --execute
          - fix-stuck-documents --dry-run
          - fix-stuck-documents
          - fix-stuck-documents --include-errors --dry-run
          - fix-stuck-documents --include-errors
          - fix-stuck-documents --doc-id --dry-run
          - fix-stuck-documents --doc-id
          - backfill-display-filename --dry-run
          - backfill-display-filename
          - backfill-display-filename --force
          - cleanup-duplicates
          - cleanup-duplicates --execute
          - force-reindex --all-drift
          - force-reindex --all-drift --execute
          - force-reindex --all-drift --missing-hash-only
          - force-reindex --all-drift --missing-hash-only --execute
          - force-reindex --doc-id
          - force-reindex --doc-id --execute
          - investigate-office-duplicate
          - investigate-caremanager-duplicate
          - investigate-caremanager-folder-duplicate
          - investigate-drive-folder-duplicate-by-name
          - investigate-drive-folder-duplicate-by-name --include-trashed
          - investigate-issue811-root-cause
          - investigate-issue811-root-cause --scan-root-duplicates
          - investigate-issue811-root-cause --list-children
          - retry-drive-export-doc --doc-id
          - investigate-issue811-root-cause --full-chain
          - audit-short-office-masters
          - audit-short-office-masters --max-length 3
          - audit-short-office-masters --max-length 4
          - audit-short-office-masters --fail-on-id-equals-name
          - inspect-ocr-volume-stats
          - inspect-ocr-volume-stats --days 90
          - inspect-ocr-volume-stats --days 90 --sample-limit 20000
          - delete-office-master --dry-run
          - delete-office-master --execute
          - reset-documents-by-office --dry-run
          - reset-documents-by-office --execute
          - cleanup-office-name --dry-run
          - cleanup-office-name --execute
          - inspect-document --file-name
          - inspect-document --file-name --include-related
          - inspect-document --doc-id
          - inspect-document --doc-id --include-related
          - reset-document-to-pending --doc-id --dry-run
          - reset-document-to-pending --doc-id --execute
          - audit-storage-mismatch
          - audit-storage-mismatch --no-orphans
          - audit-storage-mismatch --no-collisions
          - audit-storage-mismatch --show-creation-times
          - audit-session61-parent-provenance
          - classify-drive-folder-duplicates
          - setup-drive-folder-fixture --dev
          - setup-drive-folder-fixture --dev --cleanup
          - setup-drive-folder-fixture --dev --tree-merge-scenario
          - execute-drive-folder-merge --dry-run
          - execute-drive-folder-merge --execute
          - rollback-drive-folder-merge --dry-run
          - rollback-drive-folder-merge --execute
          - audit-drive-sibling-duplicates
          - execute-drive-sibling-merge --dry-run
          - execute-drive-sibling-merge --execute
          - plan-drive-folder-tree-merge
          - execute-drive-folder-tree-merge --dry-run
          - execute-drive-folder-tree-merge --execute
          - classify-collision-docs
          - setup-collision-fixture --dev
          - setup-collision-fixture --dev --cleanup
