          - migrate-document-groups --backfill-cm-unassigned --dry-run
          - migrate-document-groups --backfill-cm-unassigned
          - migrate-document-groups --rebuild-groups --dry-run
          - migrate-document-groups --rebuild-groups
          - migrate-document-groups --seed-aggregation-states --dry-run
          - migrate-document-groups --seed-aggregation-states
          - migrate-document-groups --reopen-gate --dry-run
          - migrate-document-groups --reopen-gate
          - check-function-error-logs --hours 24
          - check-function-error-logs --hours 72
          - check-function-error-logs --hours 168
          - check-paddle-ocr-step0
          - audit-filename-pattern-issue686
          - backfill-drive-export --dry-run
          - backfill-drive-export
          - audit-drive-folder-space-variants
          - drive-export-status-report
          - drive-export-status-report --breakdown
          - audit-fax-duplication-inventory
          - audit-fax-duplication-inventory --full-scan
          - audit-fax-duplication-plan-logs --hours 168
          - audit-fax-duplication-plan-logs --hours 336
          - audit-fax-duplication-plan-logs --hours 504
          - set-feature-flag --flag driveExport --value true --dry-run
          - set-feature-flag --flag driveExport --value true
          - set-feature-flag --flag driveExport --value false --dry-run
          - set-feature-flag --flag driveExport --value false
          - set-feature-flag --flag driveFolderClaimRead --value true --dry-run
          - set-feature-flag --flag driveFolderClaimRead --value true
          - set-feature-flag --flag driveFolderClaimRead --value false --dry-run
          - set-feature-flag --flag driveFolderClaimRead --value false
          - set-drive-allowlist --set --dry-run
          - set-drive-allowlist --set
          - set-drive-allowlist --clear-empty --dry-run
          - set-drive-allowlist --clear-empty
          - set-drive-allowlist --remove --dry-run
          - set-drive-allowlist --remove
          - set-feature-flag --flag paddleOcr --value true --dry-run
          - set-feature-flag --flag paddleOcr --value true
          - set-feature-flag --flag paddleOcr --value false --dry-run
          - set-feature-flag --flag paddleOcr --value false
          - set-paddle-ocr-allowlist --set --dry-run
          - set-paddle-ocr-allowlist --set
          - set-paddle-ocr-allowlist --clear-empty --dry-run
          - set-paddle-ocr-allowlist --clear-empty
          - set-paddle-ocr-allowlist --remove --dry-run
          - set-paddle-ocr-allowlist --remove
          - backfill-drive-export --dry-run --limit --expected-count
          - backfill-drive-export --limit --expected-count
          - backfill-drive-export --dry-run --expected-count
          - backfill-drive-export --expected-count
          - backfill-confirm-on-verify --dry-run
          - backfill-confirm-on-verify
          - backfill-confirm-on-verify --dry-run --limit --expected-count
          - backfill-confirm-on-verify --limit --expected-count
          - backfill-confirm-on-verify --dry-run --expected-count
          - backfill-confirm-on-verify --expected-count
          - backfill-customer-id-link --dry-run
          - backfill-customer-id-link --dry-run --limit --expected-count
          - backfill-customer-id-link --limit --expected-count
          - backfill-customer-id-link --expected-count
          - backfill-customer-id-link --whitespace-variants --dry-run
          - backfill-customer-id-link --whitespace-variants --dry-run --limit --expected-count
          - backfill-customer-id-link --whitespace-variants --limit --expected-count
          - backfill-customer-id-link --whitespace-variants --expected-count
          - classify-drive-export-drift
          - classify-drive-export-drift --care-manager
          - classify-drive-export-drift --care-manager --limit
          - execute-drive-export-repair --dry-run
          - execute-drive-export-repair --dry-run --limit --expected-count
          - execute-drive-export-repair --execute --limit --expected-count
