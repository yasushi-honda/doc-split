name: Deploy Firestore Rules

# firestore.rules / storage.rules / firestore.indexes.jsonを対象環境へデプロイする。
# ローカルFirebase CLIログインが失効している環境(kanameone等)向けに、
# deploy-firestore-indexes.yml/deploy-functions.ymlと同じSA鍵認証パターンを再利用する。
# 複数人記載FAX検出機能(ADR-0024)のPR-B rules変更をkanameoneへ反映する必要が生じ新設。
# deploy-to-project.sh <alias> --rules のローカル手順(Hosting+Rules)のうち、
# Rules部分のみをGitHub Actions経由で実行できるようにする(Hostingは既存の
# Deploy Firebase Hosting workflowで代替可能)。

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - kanameone
          - cocoro

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: |-
            ${{ github.event.inputs.environment == 'kanameone' && secrets.GCP_SA_KEY_KANAMEONE ||
                github.event.inputs.environment == 'dev' && secrets.GCP_SA_KEY_DEV ||
                secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore/Storage rules + indexes
        run: |
          if [ "${{ github.event.inputs.environment }}" == "cocoro" ]; then
            PROJECT_ALIAS="cocoro"
          elif [ "${{ github.event.inputs.environment }}" == "kanameone" ]; then
            PROJECT_ALIAS="kanameone"
          else
            PROJECT_ALIAS="dev"
          fi

          echo "Deploying firestore:rules,firestore:indexes,storage to: $PROJECT_ALIAS"
          firebase deploy --only firestore:rules,firestore:indexes,storage -P $PROJECT_ALIAS --force

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == 'success' ]; then
            echo "✅ Firestore/Storage rules deployment successful"
          else
            echo "❌ Firestore/Storage rules deployment failed"
          fi
