name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (for Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Lint functions
        run: npm run lint:functions

      - name: Type check frontend
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Build functions
        run: npm run build:functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore rules tests
        run: |
          cd functions && firebase emulators:exec --only firestore 'npm run test:rules'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Run unit tests
        run: npm run test:functions

      - name: Run scripts unit tests
        # scripts/lib/*.test.ts (backfillDetailHelpers / confirmedReplayStats 等の
        # 運用スクリプト安全ロジック) はこれまでCIで未実行だった (Issue #547 Phase C
        # review B1指摘)。scriptsはroot workspacesメンバーのため依存は上のnpm ciで
        # 解決済み。node --test ランナーで軽量実行(外部依存なし、数秒)。
        run: cd scripts && npm test

      - name: Run frontend unit tests
        # frontend/src/**/__tests__/*.test.tsx (vitest) はこれまでCIで未実行だった
        # (同姓同名プロアクティブ通知UI追加、2026-07-26、Codex plan review指摘)。
        # 依存は上のnpm ciで解決済み、emulator不要で数秒。
        run: cd frontend && npm test

      - name: Run customer identity gate integration tests (Firestore emulator)
        # functions/test/exportDocumentIntegration.test.tsの顧客未確定ゲート13ケースは
        # test/*Integration.test.tsがnpm run test:functionsの対象外(functions/package.json)
        # のためこれまでCIで未実行だった(同姓同名プロアクティブ通知UI追加、2026-07-26、
        # Codex plan review指摘)。customerAmbiguityGate.tsをshared/customerIdentity.tsへ
        # 委譲するリファクタの回帰をCIで守るために追加。
        run: |
          cd functions && firebase emulators:exec --only firestore \
            'npx mocha --require ts-node/register --timeout 15000 test/exportDocumentIntegration.test.ts'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Run scripts integration tests (Firestore emulator)
        # scripts配下のPartial Updateスクリプト(backfill-drive-export.ts・
        # merge-notation-duplicate-masters.ts等)向け統合テスト(CLAUDE.md MUST: 更新対象外
        # フィールド不変テスト必須)。実Firestore書込みを伴うため、scripts/lib配下の
        # emulator非依存unitテスト(npm test)とは別立てのnpmスクリプトにする。
        # test:integrationは*.integration.test.tsグロブのため、scripts/直下に
        # 新規追加した統合テストは自動的にこのステップに含まれる(2026-07-27、
        # code-review指摘対応: 旧ステップ名がbackfill-drive-export専用のまま陳腐化していた)。
        run: cd scripts && firebase emulators:exec --only firestore 'npm run test:integration'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          firebase emulators:exec --only auth,firestore,functions \
            'FIRESTORE_EMULATOR_HOST=localhost:8085 node scripts/seed-e2e-data.js && \
             sleep 5 && \
             cd frontend && \
             npx vite --port 5173 & sleep 5 && \
             cd frontend && \
             E2E_BASE_URL=http://localhost:5173 CI=true npx playwright test --grep @emulator --project=chromium'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          VITE_USE_FIREBASE_EMULATOR: 'true'
          VITE_FIREBASE_API_KEY: 'fake-api-key-for-emulator'
          VITE_FIREBASE_AUTH_DOMAIN: 'localhost'
          VITE_FIREBASE_PROJECT_ID: 'doc-split-dev'
          VITE_FIREBASE_STORAGE_BUCKET: 'doc-split-dev.appspot.com'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000:web:fake'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
