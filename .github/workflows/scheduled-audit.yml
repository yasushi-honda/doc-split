name: Scheduled Master Audit

# #506: 短マスター混入予防のための定期 audit
# - 3 環境 (dev/kanameone/cocoro) の masters/offices/items から name.length <= 3 を抽出
# - 検出時に GitHub issue を自動作成 (運用者が next step を判断する materials)
# - cron は日次 (06:00 JST = 21:00 UTC、前日分)。Phase 1 で全 write 経路に
#   予防 validation 入れたため理論上検出ゼロのはず。検出時は新たな抜け道発見の signal。

on:
  schedule:
    # 毎日 21:00 UTC = 06:00 JST
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      max_length:
        description: 'Detect masters with name.length <= N (default: 3)'
        required: false
        default: '3'
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1 環境失敗でも他環境続行
      matrix:
        environment:
          - dev
          - kanameone
          - cocoro
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (firebase-admin)
        working-directory: ./functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: |-
            ${{ matrix.environment == 'kanameone' && secrets.GCP_SA_KEY_KANAMEONE ||
                matrix.environment == 'dev' && secrets.GCP_SA_KEY_DEV ||
                secrets.GCP_SA_KEY }}

      - name: Resolve project ID
        id: resolve
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          PROJECT_ID=$(node scripts/helpers/firebaserc-helper.js get-project "$ENVIRONMENT")
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved project_id: $ENVIRONMENT → $PROJECT_ID"

      - name: Run audit (--fail-on-detected)
        id: audit
        env:
          PROJECT_ID: ${{ steps.resolve.outputs.project_id }}
          # workflow_dispatch input は数値のみ許可 → bash で数値検証
          MAX_LENGTH_INPUT: ${{ github.event.inputs.max_length }}
        run: |
          set -euo pipefail
          # input validation (デフォルト 3、整数のみ許可、injection 防止)
          MAX_LENGTH="${MAX_LENGTH_INPUT:-3}"
          if ! [[ "$MAX_LENGTH" =~ ^[0-9]+$ ]]; then
            echo "ERROR: max_length must be non-negative integer (got: \"$MAX_LENGTH\")" >&2
            exit 1
          fi
          # #507 review Critical #2: --fail-on-collision を使うことで legitimate な
          # 短マスター ("ピース"・"わかば" 等) では false-positive Issue を抑制。
          # collision 検出 (PR #502 v2 と同じ判定) のみで通知発火する。
          #
          # 注意 (#707 調査結果): --fail-on-id-equals-name はここでは使わない。
          # doc.id===name 単体は「CSV import 由来の汚染」の必要十分条件ではなく、
          # scripts/samples/offices.csv 由来の正規サンプルマスター (dev環境に実在) 等
          # legitimate なケースでも成立するため、自動fail条件に使うと false-positive
          # Issue を量産する。手動調査用途では
          # `node scripts/audit-short-office-masters.js --fail-on-id-equals-name`
          # (run-ops-script.yml 経由) で検出結果を確認できる。
          NODE_PATH=./functions/node_modules \
            FIREBASE_PROJECT_ID="$PROJECT_ID" \
            node scripts/audit-short-office-masters.js \
              --max-length "$MAX_LENGTH" \
              --fail-on-collision

  notify-on-detection:
    needs: audit
    runs-on: ubuntu-latest
    if: always() && needs.audit.result == 'failure'
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create issue for detected short masters
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          # YAML literal block scalar の indent (10 spaces) を heredoc 内も維持する必要がある。
          # block scalar 終了と誤判定されて workflow 全体の parse が壊れ、
          # workflow_dispatch / schedule trigger が認識されなくなるため。
          # heredoc 出力後に行頭 10 spaces を sed で除去して issue body 化する。
          BODY=$(cat <<EOF
          ## Scheduled audit が短マスターを検出

          [Workflow run](${RUN_URL}) で 3 環境 (dev/kanameone/cocoro) のいずれかで length<=3 の office マスターが検出されました。

          ## 確認手順
          1. workflow run ログで該当 master id / name / 環境を確認
          2. legitimate な短マスター (新規追加分) なら本 issue を close
          3. CSV import 由来の汚染なら scripts/delete-office-master + scripts/reset-documents-by-office で cleanup

          ## 関連
          - Issue #506 (予防策実装の親 Issue)
          - Phase 1 で全 write 経路に validation 入れたため理論上検出ゼロのはず。本検出は新たな抜け道発見の signal。
          EOF
          )
          # shellcheck disable=SC2001  # 行頭限定除去のため sed が簡潔
          BODY=$(echo "$BODY" | sed 's/^          //')
          gh issue create \
            --title "[scheduled-audit] 短 office マスター検出 (${TODAY})" \
            --label "bug,P2" \
            --body "$BODY"

  cocoro-hosting-lag:
    # cocoro Hosting は deploy-hosting.yml 非対応(Secrets未登録)でローカル手動デプロイが
    # 正規経路のため、frontend/ 変更の反映漏れをCIの外側で検知する手段がなかった (2026-07-28)。
    runs-on: ubuntu-latest
    outputs:
      lag_detected: ${{ steps.check.outputs.exit_code == '1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud (cocoro)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check cocoro Hosting reflection lag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/audit-cocoro-hosting-lag.js --threshold-hours 48
          code=$?
          set -e
          # スクリプトの exit code は 0=OK / 1=遅延検知 / 2=API障害等の実行エラー の3値。
          # ここを区別しないと、GCP認証やGitHub APIの一時的なエラー(exit 2)まで
          # 「遅延検知」(exit 1)と誤認して誤ったissueを量産してしまう(finder指摘)。
          # exit 2 はissue化せずworkflow annotationとして可視化するに留める。
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "1" ]; then
            echo "::warning::cocoro-hosting-lag audit script failed unexpectedly (exit $code) — infra error, not a lag detection"
          fi

  notify-cocoro-hosting-lag:
    needs: cocoro-hosting-lag
    runs-on: ubuntu-latest
    if: always() && needs.cocoro-hosting-lag.outputs.lag_detected == 'true'
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if an open issue already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COUNT=$(gh issue list --state open --json title \
            --jq '[.[] | select(.title | startswith("[scheduled-audit] cocoro Hosting未反映"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create issue for cocoro Hosting lag
        if: steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          BODY=$(cat <<EOF
          ## cocoro Hosting反映が閾値(48時間)を超えて遅延

          [Workflow run](${RUN_URL}) で、frontend/ の最新マージ済みcommitに対し
          cocoroのFirebase Hosting反映が48時間以上遅延していることを検知しました。

          ## 背景
          cocoro Hostingは .github/workflows/deploy-hosting.yml の対象外
          (VITE_FIREBASE_*_COCORO Secrets未登録)のため、ローカル手動
          \`./scripts/switch-client.sh cocoro && ./scripts/deploy-to-project.sh cocoro\`
          が正規デプロイ経路です。

          ## 確認手順
          1. workflow run ログでlag時間・commit時刻・release時刻を確認
          2. 反映が必要なら上記コマンドでcocoro Hostingを手動デプロイ
          3. 意図的な保留(リリース待ち等)なら本issueに理由を記載しpostponedラベルを付与
          EOF
          )
          # shellcheck disable=SC2001
          BODY=$(echo "$BODY" | sed 's/^          //')
          gh issue create \
            --title "[scheduled-audit] cocoro Hosting未反映 (${TODAY})" \
            --label "bug,P2" \
            --body "$BODY"
