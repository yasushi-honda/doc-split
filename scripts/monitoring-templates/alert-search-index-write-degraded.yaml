displayName: "[__ENV__] search_index_write_degraded: 検索インデックス書込み劣化 (24h detect, 7d persist)"
documentation:
  content: |
    検索インデックス(`search_index/{tokenId}`)の書込みが劣化しています(Issue #984)。次のいずれかを検知します。

    1. `[searchIndexer] token skipped: document size limit`
       高頻度トークンの search_index 文書が Firestore の 1MiB 上限に達し、その書類の当該トークンだけを
       スキップして他のトークンを登録しました(`searchIndexer.addDocumentToIndex` のフォールバック)。
       ログの `tokenIds=` に、スキップした(=飽和した)高頻度トークンの ID が出ます。
    2. `[searchIndexer] index write failed`
       サイズ超過と判定できなかった索引書込みの失敗です。サイズ超過の判定関数が SDK/バックエンドの
       エラー文言の変更で外れた可能性があります。`code=` と `message=` を確認してください
       (`functions/src/utils/firestoreErrors.ts` の `isFirestoreDocumentSizeExceededError`)。

    **kanameone では、根本対応(段階2: postings のシャーディング等)が済むまで 2026 年の新規書類のたびに 1 が出るため、
    常時 open のままが正常です。** 「新しいトークンが飽和し始めた」信号は、アラートの有無ではなく、
    ログの `tokenIds=` に**これまで出ていなかった tokenId が現れたか**で読んでください。
    既知の飽和トークン: `00177502`("2026")。次に飽和しうるもの(2026-09-20 時点で上限の約82%):
    `00000644`("26")、`0000063e`("20")、`00000602`("02")、`000006ba`。

    スキップされた書類は、そのトークンでは検索にヒットしません(他のトークンでは検索可能)。
    `documents.search.skippedTokens` にスキップしたトークン文字列が保存されます。
    運用 SOP: docs/context/monitoring-setup.md、復旧: docs/context/search-index-recovery.md 参照。

    一時的な監視です(下記 userLabels)。段階2の計画確定時に、恒久化(常時 open を避ける閾値見直しを含む)するか
    削除するかを再判断してください。
  mimeType: "text/markdown"
combiner: OR
conditions:
  - displayName: "search_index_write_degraded > 0 in 24h"
    conditionThreshold:
      filter: 'metric.type="logging.googleapis.com/user/search_index_write_degraded" AND resource.type="cloud_run_revision"'
      aggregations:
        - alignmentPeriod: 86400s
          perSeriesAligner: ALIGN_SUM
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: 0s
alertStrategy:
  autoClose: 604800s
userLabels:
  source: docsplit-monitoring-setup
  lifecycle: temporary
  review_by: "2026-10-31"
notificationChannels:
  - __NOTIFICATION_CHANNEL__
