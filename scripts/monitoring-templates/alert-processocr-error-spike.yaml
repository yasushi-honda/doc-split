displayName: "[__ENV__] processocr_error: processOCR document処理エラー発生"
documentation:
  content: |
    ADR-0025 PaddleOCR Pass1全面切替(2026-09-19、dev/kanameone/cocoro 3環境)後の
    事後監視として追加。切替前Step0④実測ベースライン(直近7日のstatus:error率)は
    dev/kanameone/cocoroいずれも0.00%(kanameone: total=1949件・error=0件)であり、
    実績上「発生自体が異常」と判断し閾値1件で即時発火とする。

    `Error processing document`(ocrProcessor.ts handleProcessingError、
    status確定判定より前の無条件console.error)ログの発生を検知する。
    注意: このログはtransientエラー(429/network/timeout等、自動リトライで
    最終的にstatus:'pending'へ戻り成功しうる一時失敗)でも出力されるため、
    「status:error確定」そのものではない(Fable 5.1セカンドオピニオン指摘、
    2026-09-19)。有効化前に3環境で実測した結果、直近7日の発生件数は
    いずれも0件だったため閾値1件のまま採用したが、将来transientエラーが
    日常的に発生するようになった場合は誤発火しうる点に留意すること。

    対応: Cloud Loggingでprocessocr関連のERRORログを確認し、対象docIdの
    status/lastErrorMessageをFirestoreで確認する。一時的な監視強化のため、
    review_by(下記userLabels)までに削除するか恒久運用に格上げするか再判断する。
  mimeType: "text/markdown"
combiner: OR
conditions:
  - displayName: "processocr_error > 0 in 1h"
    conditionThreshold:
      filter: 'metric.type="logging.googleapis.com/user/processocr_error" AND resource.type="cloud_run_revision"'
      aggregations:
        - alignmentPeriod: 3600s
          perSeriesAligner: ALIGN_SUM
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: 0s
alertStrategy:
  autoClose: 86400s
userLabels:
  source: docsplit-monitoring-setup
  lifecycle: temporary
  review_by: "2026-10-03"
notificationChannels:
  - __NOTIFICATION_CHANNEL__
